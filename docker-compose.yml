version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./mosquitto/config:/mosquitto/config:rw
      - ./mosquitto/data:/mosquitto/data:rw
      - ./mosquitto/log:/mosquitto/log:rw

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: watersys
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: on-failure
    depends_on:
      - mosquitto
      - postgres
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      PORT: 3000
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      MQTT_BROKER: ${MQTT_BROKER:?Set MQTT_BROKER in .env}
      MQTT_TOPIC_BASE: watersystem
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DEMO_FALLBACK_ENABLED: "false"
      REMOTE_REQUIRE_TOKEN: "true"
      REMOTE_ADMIN_TOKEN: ${REMOTE_ADMIN_TOKEN:?Set REMOTE_ADMIN_TOKEN in .env}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: watersys
      PGPORT: 5432
      # Уведомления об авариях (Telegram + SMS)
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TG_CHAT_ID: ${TG_CHAT_ID:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-none}
      SMS_PHONE: ${SMS_PHONE:-}
      SMS_FROM: ${SMS_FROM:-WATERSYS}
      SMSAERO_EMAIL: ${SMSAERO_EMAIL:-}
      SMSAERO_API_KEY: ${SMSAERO_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      NOTIFY_REPEAT_MIN: ${NOTIFY_REPEAT_MIN:-10}
      NOTIFY_REPEAT_MAX: ${NOTIFY_REPEAT_MAX:-5}
      # MAX (мессенджер через WQTT MQTT-мост)
      WQTT_TOKEN: ${WQTT_TOKEN:-}
      WQTT_TOPIC: ${WQTT_TOPIC:-maxmsg}
      WQTT_HOST: ${WQTT_HOST:-dash.wqtt.ru}
    ports:
      - '3000:3000'

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus

volumes:
  pgdata:
  prometheus_data:
  grafana_data: