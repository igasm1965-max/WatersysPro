<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>WaterSysPro — Relay Module (6 каналов)</title>
  <description>Схема подключения 6-канального релейного модуля к ESP32</description>

  <rect width="800" height="600" fill="#FAFAFA" rx="8"/>
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#D32F2F">Relay Module — 6 каналов управления</text>

  <!-- ESP32 -->
  <rect x="30" y="100" width="180" height="280" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="120" y="130" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1565C0">ESP32</text>
  <text x="120" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">GPIO Outputs</text>

  <text x="35" y="190" font-family="monospace" font-size="12" fill="#B71C1C">GPIO13 → PUMP1</text>
  <text x="35" y="220" font-family="monospace" font-size="12" fill="#B71C1C">GPIO12 → PUMP2</text>
  <text x="35" y="250" font-family="monospace" font-size="12" fill="#B71C1C">GPIO14 → AERATION</text>
  <text x="35" y="280" font-family="monospace" font-size="12" fill="#B71C1C">GPIO27 → OZONE</text>
  <text x="35" y="310" font-family="monospace" font-size="12" fill="#B71C1C">GPIO26 → FILTER</text>
  <text x="35" y="340" font-family="monospace" font-size="12" fill="#B71C1C">GPIO25 → BACKWASH</text>

  <!-- Relay Module -->
  <rect x="350" y="60" width="400" height="360" rx="8" fill="#FFEBEE" stroke="#D32F2F" stroke-width="2"/>
  <text x="550" y="90" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#D32F2F">6-Channel Relay Module</text>
  <text x="550" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">SRD-05VDC-SL-C / HL-54S V1.0</text>

  <!-- Relay 1 -->
  <rect x="370" y="130" width="360" height="40" rx="4" fill="#FFCDD2" stroke="#E53935" stroke-width="1"/>
  <text x="380" y="155" font-family="monospace" font-size="12" fill="#B71C1C">CH1</text>
  <text x="430" y="155" font-family="sans-serif" font-size="12" fill="#B71C1C">PUMP1 — Насос наполнения</text>
  <text x="700" y="155" text-anchor="end" font-family="monospace" font-size="11" fill="#B71C1C">IN ← GPIO13</text>

  <!-- Relay 2 -->
  <rect x="370" y="175" width="360" height="40" rx="4" fill="#FFCDD2" stroke="#E53935" stroke-width="1"/>
  <text x="380" y="200" font-family="monospace" font-size="12" fill="#B71C1C">CH2</text>
  <text x="430" y="200" font-family="sans-serif" font-size="12" fill="#B71C1C">PUMP2 — Насос фильтрации</text>
  <text x="700" y="200" text-anchor="end" font-family="monospace" font-size="11" fill="#B71C1C">IN ← GPIO12</text>

  <!-- Relay 3 -->
  <rect x="370" y="220" width="360" height="40" rx="4" fill="#FFCDD2" stroke="#E53935" stroke-width="1"/>
  <text x="380" y="245" font-family="monospace" font-size="12" fill="#B71C1C">CH3</text>
  <text x="430" y="245" font-family="sans-serif" font-size="12" fill="#B71C1C">AERATION — Аэрация</text>
  <text x="700" y="245" text-anchor="end" font-family="monospace" font-size="11" fill="#B71C1C">IN ← GPIO14</text>

  <!-- Relay 4 -->
  <rect x="370" y="265" width="360" height="40" rx="4" fill="#FFCDD2" stroke="#E53935" stroke-width="1"/>
  <text x="380" y="290" font-family="monospace" font-size="12" fill="#B71C1C">CH4</text>
  <text x="430" y="290" font-family="sans-serif" font-size="12" fill="#B71C1C">OZONE — Озонатор</text>
  <text x="700" y="290" text-anchor="end" font-family="monospace" font-size="11" fill="#B71C1C">IN ← GPIO27</text>

  <!-- Relay 5 -->
  <rect x="370" y="310" width="360" height="40" rx="4" fill="#FFCDD2" stroke="#E53935" stroke-width="1"/>
  <text x="380" y="335" font-family="monospace" font-size="12" fill="#B71C1C">CH5</text>
  <text x="430" y="335" font-family="sans-serif" font-size="12" fill="#B71C1C">FILTER — Фильтр</text>
  <text x="700" y="335" text-anchor="end" font-family="monospace" font-size="11" fill="#B71C1C">IN ← GPIO26</text>

  <!-- Relay 6 -->
  <rect x="370" y="355" width="360" height="40" rx="4" fill="#FFCDD2" stroke="#E53935" stroke-width="1"/>
  <text x="380" y="380" font-family="monospace" font-size="12" fill="#B71C1C">CH6</text>
  <text x="430" y="380" font-family="sans-serif" font-size="12" fill="#B71C1C">BACKWASH — Обратная промывка</text>
  <text x="700" y="380" text-anchor="end" font-family="monospace" font-size="11" fill="#B71C1C">IN ← GPIO25</text>

  <!-- Connection lines -->
  <line x1="210" y1="190" x2="370" y2="155" stroke="#1565C0" stroke-width="1.5"/>
  <line x1="210" y1="220" x2="370" y2="200" stroke="#1565C0" stroke-width="1.5"/>
  <line x1="210" y1="250" x2="370" y2="245" stroke="#1565C0" stroke-width="1.5"/>
  <line x1="210" y1="280" x2="370" y2="290" stroke="#1565C0" stroke-width="1.5"/>
  <line x1="210" y1="310" x2="370" y2="335" stroke="#1565C0" stroke-width="1.5"/>
  <line x1="210" y1="340" x2="370" y2="380" stroke="#1565C0" stroke-width="1.5"/>

  <!-- Power section -->
  <rect x="30" y="440" width="740" height="140" rx="6" fill="#FFEBEE" stroke="#D32F2F" stroke-width="1.5"/>
  <text x="400" y="465" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#D32F2F">Питание релейного модуля</text>

  <text x="40" y="490" font-family="sans-serif" font-size="12" fill="#B71C1C">• VCC реле: 5V (питание катушек реле)</text>
  <text x="40" y="510" font-family="sans-serif" font-size="12" fill="#B71C1C">• GND: общий с ESP32</text>
  <text x="40" y="530" font-family="sans-serif" font-size="12" fill="#B71C1C">• JD-VCC: питание драйвера (обычно перемычка с VCC, если не нужна опторазвязка)</text>
  <text x="40" y="550" font-family="sans-serif" font-size="12" fill="#B71C1C">• Коммутируемое напряжение: до 250V AC / 30V DC, макс. ток 10A на канал</text>
  <text x="40" y="570" font-family="sans-serif" font-size="12" fill="#B71C1C">• ⚠ Для индуктивных нагрузок (насосы) рекомендуется защитный диод параллельно нагрузке</text>

  <text x="400" y="595" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#999">WaterSysPro v1.3.5 — docs/schematics/relays.svg</text>
</svg>