<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>WaterSysPro — SD Card (SPI mode) подключение</title>
  <description>Схема подключения microSD карты в SPI режиме к ESP32</description>

  <rect width="800" height="600" fill="#FAFAFA" rx="8"/>
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#E65100">SD Card (SPI mode) — Схема подключения</text>

  <!-- ESP32 -->
  <rect x="50" y="200" width="200" height="250" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="150" y="230" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1565C0">ESP32</text>
  <text x="150" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">SPI Controller</text>

  <!-- ESP32 SPI pins -->
  <text x="55" y="290" font-family="monospace" font-size="12" fill="#E65100">GPIO4  → SCK</text>
  <text x="55" y="315" font-family="monospace" font-size="12" fill="#E65100">GPIO19 → MISO</text>
  <text x="55" y="340" font-family="monospace" font-size="12" fill="#E65100">GPIO23 → MOSI</text>
  <text x="55" y="365" font-family="monospace" font-size="12" fill="#E65100">GPIO33 → CS</text>
  <text x="55" y="390" font-family="monospace" font-size="12" fill="#E65100">GPIO39 → CD (opt)</text>

  <!-- SD Card Module -->
  <rect x="450" y="180" width="250" height="280" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="575" y="210" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#E65100">microSD Card Module</text>

  <!-- SD pins -->
  <text x="460" y="250" font-family="monospace" font-size="12" fill="#E65100">Pin 1  — CS (chip select)</text>
  <text x="460" y="275" font-family="monospace" font-size="12" fill="#E65100">Pin 2  — MOSI (DI)</text>
  <text x="460" y="300" font-family="monospace" font-size="12" fill="#212121">Pin 3  — GND</text>
  <text x="460" y="325" font-family="monospace" font-size="12" fill="#D32F2F">Pin 4  — VCC (3.3V)</text>
  <text x="460" y="350" font-family="monospace" font-size="12" fill="#E65100">Pin 5  — SCK (CLK)</text>
  <text x="460" y="375" font-family="monospace" font-size="12" fill="#212121">Pin 6  — GND</text>
  <text x="460" y="400" font-family="monospace" font-size="12" fill="#E65100">Pin 7  — MISO (DO)</text>
  <text x="460" y="425" font-family="monospace" font-size="12" fill="#666">Pin 8  — NC</text>
  <text x="460" y="450" font-family="monospace" font-size="12" fill="#E65100">CD    — Card Detect</text>

  <!-- Connection lines -->
  <line x1="250" y1="290" x2="450" y2="325" stroke="#E65100" stroke-width="2"/>
  <line x1="250" y1="315" x2="450" y2="400" stroke="#E65100" stroke-width="2"/>
  <line x1="250" y1="340" x2="450" y2="275" stroke="#E65100" stroke-width="2"/>
  <line x1="250" y1="365" x2="450" y2="250" stroke="#E65100" stroke-width="2"/>
  <line x1="250" y1="390" x2="450" y2="450" stroke="#E65100" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Labels on lines -->
  <text x="330" y="305" font-family="monospace" font-size="10" fill="#E65100">SCK</text>
  <text x="330" y="355" font-family="monospace" font-size="10" fill="#E65100">MISO</text>
  <text x="330" y="280" font-family="monospace" font-size="10" fill="#E65100">MOSI</text>
  <text x="330" y="255" font-family="monospace" font-size="10" fill="#E65100">CS</text>

  <!-- Power section -->
  <rect x="50" y="480" width="700" height="100" rx="6" fill="#FFEBEE" stroke="#D32F2F" stroke-width="1.5"/>
  <text x="400" y="505" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#D32F2F">Питание и предупреждения</text>
  <text x="60" y="530" font-family="sans-serif" font-size="12" fill="#B71C1C">⚠ VCC подключать ТОЛЬКО к 3.3V! Подключение к 5V может повредить SD-карту и ESP32!</text>
  <text x="60" y="550" font-family="sans-serif" font-size="12" fill="#B71C1C">⚠ Рекомендуется подтягивающий резистор 10кОм на линиях MISO, CS, CD к 3.3V</text>
  <text x="60" y="570" font-family="sans-serif" font-size="12" fill="#B71C1C">⚠ Если модуль имеет встроенный level-shifter — проверьте его документацию</text>

  <text x="400" y="595" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#999">WaterSysPro v1.3.5 — docs/schematics/sd_card.svg</text>
</svg>